redis: 
  image: 
    repository: bitnamilegacy/redis
  auth:
    enabled: false
  global:
    storageClass: "longhorn"
  master:
    persistence: 
      size: 1Gi
  replica:
    persistence: 
      size: 1Gi 

mongodb: 
  image: 
    repository: bitnamilegacy/mongodb
  global:
    storageClass: "longhorn"
  persistence:
    size: 1Gi


rabbitmq: 
  image: 
    repository: bitnamilegacy/rabbitmq
  global:
    storageClass: "longhorn"
  persistence:
    size: 1Gi