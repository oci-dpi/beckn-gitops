---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-postgres-cluster
spec:
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    - merge:
        mergeKeys: [server]
        generators:
          - clusters:
              values:
                addonChart: postgres-cluster
                # anything not staging or prod use this version
                addonChartVersion: 0.3.1
                addonChartRepositoryNamespace: postgres
              selector:
                matchExpressions:
                  - key: enable_beckn_postgres
                    operator: In
                    values: ['true']
          - clusters:
              selector:
                matchLabels:
                  environment: dev
              values:
                addonChartVersion: 0.3.1
  template:
    metadata:
      name: '{{values.addonChart}}'
      annotations:
        argocd.argoproj.io/sync-wave: "-5"  
    spec:
      project: default
      sources:
        - repoURL: '{{metadata.annotations.addons_repo_url}}'
          targetRevision: '{{metadata.annotations.addons_repo_revision}}'
          ref: values
        - path: bootstrap/beckn/{{values.addonChart}}
          repoURL: '{{metadata.annotations.addons_repo_url}}'
          targetRevision: '{{metadata.annotations.addons_repo_revision}}'
          helm:
            releaseName: '{{values.addonChart}}'
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/{{metadata.annotations.addons_repo_basepath}}environments/default/addons/{{values.addonChart}}/values.yaml
            values: |
              pg_super_password: '{{metadata.annotations.pg_super_password}}'
              pg_db_password: '{{metadata.annotations.pg_db_password}}'
      destination:
        namespace: '{{values.addonChartRepositoryNamespace}}'
        name: '{{name}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # - ServerSideApply=true  # Big CRDs.
