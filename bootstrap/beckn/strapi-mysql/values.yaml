# Default values for strapi-mysql
replicaCount: 1

image:
  repository: docker.io/mysql/mysql-server
  tag: latest
  pullPolicy: IfNotPresent

mysql:
  rootUser: root
  rootPassword: 
  database: strapi
  port: 3306

persistence:
  enabled: true
  storageClass: oci-bv
  accessMode: ReadWriteOnce
  size: 50Gi

config:
  customCnf: |
    [mysqld]
    sort_buffer_size = 64M

service:
  type: ClusterIP
  port: 3306
