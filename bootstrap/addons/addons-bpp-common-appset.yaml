---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-bpp-common
spec:
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    - merge:
        mergeKeys: [server]
        generators:
          - clusters:
              values:
                addonChart: bpp-common
                # anything not staging or prod use this version
                addonChartVersion: 0.1.0
                addonChartRepositoryNamespace: bpp-common
              selector:
                matchExpressions:
                  - key: enable_beckn_disabled
                    operator: In
                    values: ['true']
          - clusters:
              selector:
                matchLabels:
                  environment: dev
              values:
                addonChartVersion: 0.1.0
  template:
    metadata:
      name: '{{values.addonChart}}'
    spec:
      project: default
      sources:
        - repoURL: '{{metadata.annotations.addons_repo_url}}'
          targetRevision: '{{metadata.annotations.addons_repo_revision}}'
          ref: values
        - path: bootstrap/beckn/{{values.addonChart}}
          repoURL: '{{metadata.annotations.addons_repo_url}}'
          targetRevision: '{{metadata.annotations.addons_repo_revision}}'
          helm:
            releaseName: '{{values.addonChart}}'
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/{{metadata.annotations.addons_repo_basepath}}environments/default/addons/{{values.addonChart}}/values.yaml
            values: |
              mongodb: 
                auth:
                  enabled: true
                  rootUser: "{{ metadata.annotations.bpp_mongo_auth_username }}"
                  rootPassword: "{{ metadata.annotations.bpp_mongo_auth_password }}"
                  usernames:
                    - "{{ metadata.annotations.bpp_mongo_username }}"
                  passwords:
                    - "{{ metadata.annotations.bpp_mongo_password }}"
                  databases:
                    - "protocol_server" 
              rabbitmq: 
                auth:
                  username: "{{ metadata.annotations.bpp_rabbitmq_username }}" 
                  password: "{{ metadata.annotations.bpp_rabbitmq_password }}"
                  securePassword: false 
      destination:
        namespace: '{{values.addonChartRepositoryNamespace}}'
        name: '{{name}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # - ServerSideApply=true  # Big CRDs.
