# -----------------------------------------------------------------------------
# This ApplicationSet requires the following ArgoCD Application annotations:
# - addons_repo_url:               The Git repository URL containing addon sources
# - addons_repo_revision:          The Git revision/branch containing addon sources
# - addons_repo_basepath:          The base path prefix within the repository
# - oke_cluster_id:                The OKE Kubernetes Cluster OCID
# - oke_cluster_compartment_id:    The compartment OCID where the cluster resides
# - cluster_name:                  The Kubernetes Cluster Name
# - log_analysis_namespace:        The namespace for log analysis resources
# - log_group_id:                  The Log Analytics Log Group OCID
# - log_analytics_entity_id:       The Log Analytics Cluster Entity OCID
# - mgmt_agent_rsp_cnt:            The Management Agent Install Key file contents
#
# These annotations are used for templating Helm chart values, and must be set 
# on the Application resource that references this ApplicationSet.
# -----------------------------------------------------------------------------

---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-oci-monitoring
spec:
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    - merge:
        mergeKeys: [server]
        generators:
          - clusters:
              values:
                addonChart: oci-monitoring
                # anything not staging or prod use this version
                addonChartVersion: 4.0.0
                addonChartRepositoryNamespace: oci-onm
              selector:
                matchExpressions:
                  - key: enable_oci_monitoring
                    operator: In
                    values: ['true']
          - clusters:
              selector:
                matchLabels:
                  environment: dev
              values:
                addonChartVersion: 4.0.0
  template:
    metadata:
      name: '{{values.addonChart}}'
    spec:
      project: default
      sources:
        - repoURL: '{{metadata.annotations.addons_repo_url}}'
          targetRevision: '{{metadata.annotations.addons_repo_revision}}'
          ref: values
        - path: bootstrap/oci/{{values.addonChart}}/oci-onm
          repoURL: '{{metadata.annotations.addons_repo_url}}'
          targetRevision: '{{metadata.annotations.addons_repo_revision}}'
          helm:
            releaseName: '{{values.addonChart}}'
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/{{metadata.annotations.addons_repo_basepath}}environments/default/addons/{{values.addonChart}}/values.yaml
            values: |
              global: 
                kubernetesClusterID: {{metadata.annotations.oke_cluster_id}}
                kubernetesClusterName: {{metadata.annotations.cluster_name}}
              oci-onm-logan:
                ociLANamespace: {{metadata.annotations.log_analysis_namespace}}
                ociLALogGroupID: {{metadata.annotations.log_group_id}}
                ociLAClusterEntityID: {{metadata.annotations.log_analytics_entity_id}}
              oci-onm-mgmt-agent:
                kubernetesCluster:
                  compartmentId: {{metadata.annotations.oke_cluster_compartment_id}}
                mgmtagent: 
                  installKeyFileContent: {{metadata.annotations.mgmt_agent_rsp_cnt}}
                  image:
                    url: container-registry.oracle.com/oci_observability_management/oci-management-agent:1.7.0
      destination:
        namespace: '{{values.addonChartRepositoryNamespace}}'
        name: '{{name}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # - ServerSideApply=true  # Big CRDs.
