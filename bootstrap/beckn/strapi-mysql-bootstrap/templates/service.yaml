apiVersion: v1
kind: Service
metadata:
  name: {{ include "strapi-mysql.fullname" . }}
  labels:
    app: {{ include "strapi-mysql.name" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "strapi-mysql.name" . }}
  ports:
    - name: mysql
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.mysql.port }}
