---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-airflow
spec:
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    - merge:
        mergeKeys: [server]
        generators:
          - clusters:
              values:
                addonChart: airflow
                # anything not staging or prod use this version
                addonChartVersion: 1.18.0
                addonChartRepositoryNamespace: airflow
                addonChartRepository: https://airflow.apache.org
              selector:
                matchExpressions:
                  - key: enable_beckn_disable
                    operator: In
                    values: ['true']
          - clusters:
              selector:
                matchLabels:
                  environment: dev
              values:
                addonChartVersion: 1.18.0
          - clusters:
              selector:
                matchLabels:
                  environment: prod
              values:
                addonChartVersion: 1.18.0
  template:
    metadata:
      name: '{{values.addonChart}}'
      annotations:
        argocd.argoproj.io/manifest-generate-paths: .
    spec:
      project: default
      sources:
        - repoURL: '{{metadata.annotations.addons_repo_url}}'
          targetRevision: '{{metadata.annotations.addons_repo_revision}}'
          ref: values
        - chart: '{{values.addonChart}}'
          repoURL: '{{values.addonChartRepository}}'
          targetRevision: '{{values.addonChartVersion}}'
          helm:
            releaseName: '{{values.addonChart}}'
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/{{metadata.annotations.addons_repo_basepath}}environments/default/addons/{{values.addonChart}}/values.yaml
              - $values/{{metadata.annotations.addons_repo_basepath}}environments/{{metadata.labels.environment}}/addons/{{values.addonChart}}/values.yaml
            values: |
              extraSecrets:
                'git-creds':
                  type: 'Opaque'
                  stringData: |
                    GIT_SYNC_USERNAME: "{{ metadata.annotations.github_username }}"
                    GIT_SYNC_PASSWORD: "{{ metadata.annotations.github_token }}"
                    GITSYNC_USERNAME: "{{ metadata.annotations.github_username }}"
                    GITSYNC_PASSWORD: "{{ metadata.annotations.github_token }}"
              ingress:
                apiServer:
                  enabled: true
                  annotations:
                    cert-manager.io/cluster-issuer: "{{ metadata.annotations.certificate_issuer_stage }}"
                  ingressClassName: nginx
                  hosts:
                    - name: "airflow.{{ metadata.annotations.domain }}"
                      tls:
                        enabled: true
                        secretName: "airflow-api-tls"
              postgresql: 
                global: 
                  storageClass: oci-bv
                image:
                  registry: docker.io
                  repository: bitnamilegacy/postgresql
              webserver:
                enabled: true
                defaultUser:
                  enabled: true
                  role: Admin
                  username: "{{ metadata.annotations.airflow_admin_username }}"
                  email: admin@example.com
                  firstName: admin
                  lastName: user
                  password: "{{ metadata.annotations.airflow_admin_password }}"
              workers: 
                persistence: 
                  storageClassName: oci-bv
              triggerer: 
                persistence: 
                  storageClassName: oci-bv 
              redis: 
                persistence: 
                  storageClassName: oci-bv
                password: "{{metadata.annotations.pg_db_password}}"
              data:                                                                                                 
                brokerUrl: "redis://:{{metadata.annotations.pg_db_password}}@airflow-redis:6379/0"
              dags: 
                persistence: 
                  storageClassName: oci-bv          
              logs: 
                persistence: 
                  storageClassName: oci-bv
      destination:
        namespace: '{{values.addonChartRepositoryNamespace}}'
        name: '{{name}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # - ServerSideApply=true  # Big CRDs.
