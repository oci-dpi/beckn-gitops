---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-bpp-redis
spec:
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    - merge:
        mergeKeys: [server]
        generators:
          - clusters:
              values:
                addonChart: redis
                addonChartVersion: 23.1.3
                addonChartRepositoryNamespace: bpp-common
                addonChartRepository: https://charts.bitnami.com/bitnami
              selector:
                matchExpressions:
                  - key: enable_beckn_bpp
                    operator: In
                    values: ['true']
          - clusters:
              selector:
                matchLabels:
                  environment: dev
              values:
                addonChartVersion: 23.1.3
  template:
    metadata:
      name: 'bpp-{{values.addonChart}}'
      annotations:
        argocd.argoproj.io/sync-wave: "-5"  
        argocd.argoproj.io/manifest-generate-paths: .
    spec:
      project: default
      sources:
        - repoURL: '{{metadata.annotations.addons_repo_url}}'
          targetRevision: '{{metadata.annotations.addons_repo_revision}}'
          ref: values
        - chart: '{{values.addonChart}}'
          repoURL: '{{values.addonChartRepository}}'
          targetRevision: '{{values.addonChartVersion}}'
          helm:
            releaseName: '{{values.addonChart}}'
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/{{metadata.annotations.addons_repo_basepath}}environments/default/addons/{{values.addonChart}}-bpp/values.yaml
            # values: |
            #   rabbitmq:
            #     auth:
            #       username: "{{ metadata.annotations.bpp_rabbitmq_username }}" 
            #       password: "{{ metadata.annotations.bpp_rabbitmq_password }}"
            #       securePassword: false 
            #   mongodb: 
            #     auth:
            #       enabled: true
            #       rootUser: "{{ metadata.annotations.bpp_mongo_auth_username }}"
            #       rootPassword: "{{ metadata.annotations.bpp_mongo_auth_password }}"
            #       usernames:
            #         - "{{ metadata.annotations.bpp_mongo_username }}"
            #       passwords:
            #         - "{{ metadata.annotations.bpp_mongo_password }}"
            #       databases:
            #         - "protocol_server" 
      destination:
        namespace: '{{values.addonChartRepositoryNamespace}}'
        name: '{{name}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # - ServerSideApply=true  # Big CRDs.
