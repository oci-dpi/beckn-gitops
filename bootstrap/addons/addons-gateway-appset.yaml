---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-gateway
spec:
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    - merge:
        mergeKeys: [server]
        generators:
          - clusters:
              values:
                addonChart: gateway
                # anything not staging or prod use this version
                addonChartVersion: 0.1.0
                addonChartRepositoryNamespace: gateway
              selector:
                matchExpressions:
                  - key: enable_beckn
                    operator: In
                    values: ['true']
          - clusters:
              selector:
                matchLabels:
                  environment: dev
              values:
                addonChartVersion: 0.1.0
  template:
    metadata:
      name: '{{values.addonChart}}'
      annotations:
        argocd.argoproj.io/sync-wave: "-4"  
    spec:
      project: default
      sources:
        - repoURL: '{{metadata.annotations.addons_repo_url}}'
          targetRevision: '{{metadata.annotations.addons_repo_revision}}'
          ref: values
        - path: bootstrap/beckn/{{values.addonChart}}
          repoURL: '{{metadata.annotations.addons_repo_url}}'
          targetRevision: '{{metadata.annotations.addons_repo_revision}}'
          helm:
            releaseName: '{{values.addonChart}}'
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/{{metadata.annotations.addons_repo_basepath}}environments/default/addons/{{values.addonChart}}/values.yaml
            values: |
              namespace: {{values.addonChartRepositoryNamespace}}
              externalDomain: gateway-beckn.{{ metadata.annotations.domain }}
              registry_url: "https://registry-beckn.{{ metadata.annotations.domain }}"
              ingress:
                enabled: true
                annotations: 
                  cert-manager.io/cluster-issuer: "{{ metadata.annotations.certificate_issuer }}"
                ingressClassName: nginx
                hosts:
                  - host: gateway-beckn.{{ metadata.annotations.domain }}
                    paths:
                      - /
                tls:
                  - hosts:
                      - gateway.{{ metadata.annotations.domain }}
                    secretName: beckn-onix-gateway-tls
              database:
                host: postgres-cluster-rw.postgres
                dbname: gateway
                username: "{{ metadata.annotations.pg_db_user }}"
                password: "{{ metadata.annotations.pg_db_password }}"
      destination:
        namespace: '{{values.addonChartRepositoryNamespace}}'
        name: '{{name}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # - ServerSideApply=true  # Big CRDs.
