apiVersion: v1
kind: Secret
metadata:
  name: postgresql
  annotations:
    argocd.argoproj.io/hook: PreSync
type: Opaque
stringData:
  password: {{ .Values.pg_db_password  | quote }}
  username: {{ .Values.pg_db_user | quote }}

---

apiVersion: v1
stringData:
  username: postgres
  password: {{ .Values.pg_super_password | quote }}
kind: Secret
metadata:
  name: superuser-secret
  annotations:
    argocd.argoproj.io/hook: PreSync
type: kubernetes.io/basic-auth