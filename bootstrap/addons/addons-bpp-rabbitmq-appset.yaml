---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-bpp-rabbitmq
spec:
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    - merge:
        mergeKeys: [server]
        generators:
          - clusters:
              values:
                addonChart: rabbitmq
                addonChartVersion: 16.0.14
                addonChartRepositoryNamespace: bpp-common
                addonChartRepository: https://charts.bitnami.com/bitnami
              selector:
                matchExpressions:
                  - key: enable_beckn_bap_rabbitmq
                    operator: In
                    values: ['true']
          - clusters:
              selector:
                matchLabels:
                  environment: dev
              values:
                addonChartVersion: 16.0.14
  template:
    metadata:
      name: 'bpp-{{values.addonChart}}'
      annotations:
        argocd.argoproj.io/sync-wave: "-5"  
        argocd.argoproj.io/manifest-generate-paths: .
    spec:
      project: default
      sources:
        - repoURL: '{{metadata.annotations.addons_repo_url}}'
          targetRevision: '{{metadata.annotations.addons_repo_revision}}'
          ref: values
        - chart: '{{values.addonChart}}'
          repoURL: '{{values.addonChartRepository}}'
          targetRevision: '{{values.addonChartVersion}}'
          helm:
            releaseName: '{{values.addonChart}}'
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/{{metadata.annotations.addons_repo_basepath}}environments/default/addons/{{values.addonChart}}-bpp/values.yaml
            values: |
              auth:
                username: "{{ metadata.annotations.bpp_rabbitmq_username }}" 
                password: "{{ metadata.annotations.bpp_rabbitmq_password }}"
                securePassword: false 
      destination:
        namespace: '{{values.addonChartRepositoryNamespace}}'
        name: '{{name}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # - ServerSideApply=true  # Big CRDs.
